[project]
name = "reviewer-sim"
version = "0.1.0"
description = "LLM as reviewer: readout methods (state/judge) vs generation on SSDataBench GSS 2018"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "openai>=1.40",          # OpenRouter-compatible client
    "statsmodels>=0.14",
    "autograd>=1.6",         # used by ssdatabench type2 Cramér's V variance
    "tqdm>=4.66",
    "scikit-learn>=1.4",     # Study 3 reference classifier
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (scoring integration)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewer_sim"]
